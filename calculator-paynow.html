<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Million Fishball Noodle · 計算機</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#1B1714;
    --card:#241E19;
    --display-bg:#100D0B;
    --broth:#D98A3D;
    --chili:#C1432E;
    --chili-dark:#8F2E20;
    --cream:#F4ECE2;
    --muted:#9C8F82;
    --key:#332B24;
    --key-hover:#3E342C;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--cream);
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  #app{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--card);
    border-radius:28px;
    padding:20px 18px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    margin-bottom:14px;
  }
  .eyebrow svg{ width:26px; height:16px; opacity:0.85; }
  @media (prefers-reduced-motion: no-preference){
    .eyebrow svg .steam{ animation:drift 3.2s ease-in-out infinite; transform-origin:center; }
    .eyebrow svg .steam:nth-child(2){ animation-delay:.5s; }
  }
  @keyframes drift{
    0%,100%{ transform:translateY(0) scaleY(1); opacity:.55; }
    50%{ transform:translateY(-2px) scaleY(1.08); opacity:.9; }
  }
  .eyebrow span{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  .display{
    background:var(--display-bg);
    border-radius:18px;
    padding:22px 18px 16px;
    margin-bottom:16px;
    text-align:right;
    min-height:96px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.5);
  }
  .display .op-preview{
    font-size:13px;
    color:var(--muted);
    min-height:16px;
    letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
  }
  .display .value{
    font-size:44px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
    word-break:break-all;
    line-height:1.1;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  button.key{
    border:none;
    border-radius:16px;
    background:var(--key);
    color:var(--cream);
    font-size:20px;
    font-weight:500;
    padding:16px 0;
    cursor:pointer;
    transition:background .12s ease, transform .06s ease;
    font-variant-numeric:tabular-nums;
  }
  button.key:active{ transform:scale(0.95); }
  button.key:hover{ background:var(--key-hover); }
  button.key.fn{ background:#463A2F; color:var(--broth); font-weight:600; }
  button.key.fn:hover{ background:#513F30; }
  button.key.op{ background:var(--chili); color:var(--cream); font-weight:600; }
  button.key.op:hover{ background:#D14D3D; }
  button.key.equals{ background:var(--broth); color:#1B1714; font-weight:700; }
  button.key.equals:hover{ background:#E39A50; }
  button.key.zero{ grid-column:span 2; }

  .qr-btn{
    width:100%;
    margin-top:14px;
    border:none;
    border-radius:16px;
    padding:16px 0;
    background:linear-gradient(135deg, var(--chili), var(--chili-dark));
    color:var(--cream);
    font-size:15px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:filter .12s ease, transform .06s ease;
  }
  .qr-btn:active{ transform:scale(0.98); }
  .qr-btn:hover{ filter:brightness(1.08); }
  .qr-btn svg{ width:18px; height:18px; }

  /* QR overlay */
  #qr-overlay{
    position:fixed; inset:0;
    background:var(--cream);
    color:#1B1714;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    z-index:50;
  }
  #qr-overlay.show{ display:flex; }
  .qr-eyebrow{
    font-size:12px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#8A7A68;
    font-weight:700;
    margin-bottom:6px;
  }
  .merchant-name{
    font-size:20px;
    font-weight:800;
    text-align:center;
    margin-bottom:2px;
    letter-spacing:.01em;
  }
  .merchant-uen{
    font-size:12px;
    color:#8A7A68;
    margin-bottom:22px;
    letter-spacing:.03em;
  }
  #qrcode{
    background:#fff;
    padding:18px;
    border-radius:20px;
    box-shadow:0 12px 32px rgba(0,0,0,0.18);
    margin-bottom:22px;
  }
  #qrcode img, #qrcode canvas{ display:block; border-radius:4px; }
  .qr-amount{
    font-size:34px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    margin-bottom:2px;
  }
  .qr-amount-label{
    font-size:12px;
    color:#8A7A68;
    margin-bottom:28px;
    letter-spacing:.05em;
  }
  .done-btn{
    width:100%;
    max-width:320px;
    border:none;
    border-radius:16px;
    padding:17px 0;
    background:var(--chili);
    color:#fff;
    font-size:16px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    transition:filter .12s ease, transform .06s ease;
  }
  .done-btn:active{ transform:scale(0.98); }
</style>
</head>
<body>
<div id="app">
  <div class="card">
    <div class="eyebrow">
      <svg viewBox="0 0 26 16" xmlns="http://www.w3.org/2000/svg">
        <path class="steam" d="M6 14 C6 10, 2 9, 4 5" stroke="#D98A3D" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path class="steam" d="M13 14 C13 10, 9 9, 11 4" stroke="#D98A3D" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path class="steam" d="M20 14 C20 10, 16 9, 18 5" stroke="#D98A3D" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <span>Million Fishball Noodle</span>
    </div>

    <div class="display">
      <div class="op-preview" id="opPreview">&nbsp;</div>
      <div class="value" id="display">0</div>
    </div>

    <div class="grid">
      <button class="key fn" data-action="clear">C</button>
      <button class="key fn" data-action="sign">±</button>
      <button class="key fn" data-action="percent">%</button>
      <button class="key op" data-action="op" data-op="÷">÷</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key op" data-action="op" data-op="×">×</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key op" data-action="op" data-op="−">−</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key op" data-action="op" data-op="+">+</button>

      <button class="key zero" data-digit="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key equals" data-action="equals">=</button>
    </div>

    <button class="qr-btn" id="qrBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z"/>
      </svg>
      產生 PayNow 收款碼
    </button>
  </div>
</div>

<div id="qr-overlay">
  <div class="qr-eyebrow">PayNow 掃碼付款</div>
  <div class="merchant-name">MILLION FISHBALL NOODLE</div>
  <div class="merchant-uen">UEN 53495345W</div>
  <div id="qrcode"></div>
  <div class="qr-amount" id="qrAmount">$0.00</div>
  <div class="qr-amount-label" id="qrAmountLabel">應付金額</div>
  <button class="done-btn" id="doneBtn">完成</button>
</div>

<script>
(function(){
  // ---------- Calculator logic ----------
  const displayEl = document.getElementById('display');
  const opPreviewEl = document.getElementById('opPreview');

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;
  let startNewEntry = false;

  function render(){
    displayEl.textContent = current;
    opPreviewEl.textContent = (previous !== null && operator) ? `${previous} ${operator}` : '\u00A0';
  }

  function inputDigit(d){
    if (justEvaluated){ current = '0'; justEvaluated = false; }
    if (startNewEntry){ current = '0'; startNewEntry = false; }
    if (current === '0'){ current = d; }
    else { current += d; }
    render();
  }

  function inputDecimal(){
    if (justEvaluated){ current = '0'; justEvaluated = false; }
    if (startNewEntry){ current = '0'; startNewEntry = false; }
    if (!current.includes('.')) current += '.';
    render();
  }

  function compute(a, op, b){
    a = parseFloat(a); b = parseFloat(b);
    switch(op){
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? 0 : a / b;
    }
    return b;
  }

  function formatResult(n){
    if (!isFinite(n)) return '0';
    let s = String(Math.round(n * 1e8) / 1e8);
    return s;
  }

  function setOperator(op){
    if (operator && !startNewEntry){
      previous = formatResult(compute(previous, operator, current));
      current = previous;
    } else {
      previous = current;
    }
    operator = op;
    startNewEntry = true;
    justEvaluated = false;
    render();
  }

  function equals(){
    if (operator === null || previous === null) return;
    current = formatResult(compute(previous, operator, current));
    operator = null;
    previous = null;
    startNewEntry = false;
    justEvaluated = true;
    render();
  }

  function clearAll(){
    current = '0'; previous = null; operator = null;
    justEvaluated = false; startNewEntry = false;
    render();
  }

  function toggleSign(){
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    render();
  }

  function percent(){
    current = formatResult(parseFloat(current) / 100);
    render();
  }

  document.querySelectorAll('button[data-digit]').forEach(btn=>{
    btn.addEventListener('click', ()=> inputDigit(btn.dataset.digit));
  });
  document.querySelectorAll('button[data-action="op"]').forEach(btn=>{
    btn.addEventListener('click', ()=> setOperator(btn.dataset.op));
  });
  document.querySelector('[data-action="clear"]').addEventListener('click', clearAll);
  document.querySelector('[data-action="sign"]').addEventListener('click', toggleSign);
  document.querySelector('[data-action="percent"]').addEventListener('click', percent);
  document.querySelector('[data-action="decimal"]').addEventListener('click', inputDecimal);
  document.querySelector('[data-action="equals"]').addEventListener('click', equals);

  render();

  // ---------- PayNow SGQR (EMVCo) payload ----------
  const PAYNOW_UEN = '53495345W';
  const MERCHANT_NAME = 'MILLION FISHBALL NOODLE'; // max 25 chars per EMV spec
  const MERCHANT_CITY = 'Singapore';

  function tlv(id, value){
    const len = String(value.length).padStart(2, '0');
    return `${id}${len}${value}`;
  }

  // CRC-16/CCITT-FALSE, as required by the EMVCo QR Code spec (tag 63)
  function crc16(str){
    let crc = 0xFFFF;
    for (let i = 0; i < str.length; i++){
      crc ^= (str.charCodeAt(i) << 8);
      for (let b = 0; b < 8; b++){
        crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
        crc &= 0xFFFF;
      }
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
  }

  function buildPayNowPayload(amount){
    const hasAmount = amount && amount > 0;

    const merchantAccountInfo =
      tlv('00', 'SG.PAYNOW') +      // Globally Unique Identifier
      tlv('01', '2') +              // Proxy Type: 2 = UEN
      tlv('02', PAYNOW_UEN) +       // Proxy Value
      tlv('03', hasAmount ? '0' : '1'); // Amount editable: 0=no, 1=yes

    let payload =
      tlv('00', '01') +                              // Payload Format Indicator
      tlv('01', hasAmount ? '12' : '11') +            // Point of Initiation: 12=dynamic, 11=static
      tlv('26', merchantAccountInfo) +                // Merchant Account Info (PayNow template)
      tlv('52', '0000') +                             // Merchant Category Code
      tlv('53', '702') +                              // Transaction Currency: 702 = SGD
      (hasAmount ? tlv('54', amount.toFixed(2)) : '') + // Transaction Amount
      tlv('58', 'SG') +                                // Country Code
      tlv('59', MERCHANT_NAME) +                       // Merchant Name
      tlv('60', MERCHANT_CITY);                        // Merchant City

    payload += '6304'; // CRC tag + length, value appended next
    const crc = crc16(payload);
    return payload + crc;
  }

  // ---------- QR overlay wiring ----------
  const overlay = document.getElementById('qr-overlay');
  const qrContainer = document.getElementById('qrcode');
  const qrAmountEl = document.getElementById('qrAmount');
  const qrAmountLabelEl = document.getElementById('qrAmountLabel');
  const qrBtn = document.getElementById('qrBtn');
  const doneBtn = document.getElementById('doneBtn');
  let qrInstance = null;

  qrBtn.addEventListener('click', ()=>{
    const amount = parseFloat(current) || 0;
    const payload = buildPayNowPayload(amount);

    qrContainer.innerHTML = '';
    qrInstance = new QRCode(qrContainer, {
      text: payload,
      width: 260,
      height: 260,
      colorDark: '#1B1714',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    if (amount > 0){
      qrAmountEl.textContent = '$' + amount.toFixed(2);
      qrAmountLabelEl.textContent = '應付金額';
    } else {
      qrAmountEl.textContent = '任意金額';
      qrAmountLabelEl.textContent = '顧客可自行輸入金額';
    }

    overlay.classList.add('show');
  });

  doneBtn.addEventListener('click', ()=>{
    overlay.classList.remove('show');
    clearAll();
  });
})();
</script>
</body>
</html>
