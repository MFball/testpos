<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>計算機 · PayNow</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#0A0C10;
    --bg-2:#101319;
    --key-fn:#B9BCC4;
    --key-fn-text:#0A0C10;
    --key-digit:#24272E;
    --key-digit-hover:#33363E;
    --key-op:#E6483B;
    --key-op-text:#FFF9F7;
    --text-main:#F5F6F8;
    --text-dim:#6B6F78;
    --paynow-red:#E6483B;
    --paynow-red-dim:#3A1815;
    --accent-teal:#3ACBB0;
    --radius-key:50%;
    --font-display:'SF Mono','Space Mono',ui-monospace,monospace;
    --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;background:var(--bg);
    font-family:var(--font-body);overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #app{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
  }
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    background:var(--bg);
    transition:transform .38s cubic-bezier(.32,.72,0,1), opacity .3s ease;
  }
  .screen.hidden-right{transform:translateX(100%);opacity:0;pointer-events:none;}
  .screen.hidden-left{transform:translateX(-100%);opacity:0;pointer-events:none;}

  /* ---------- CALCULATOR ---------- */
  #calc-display-wrap{
    flex:1;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding: env(safe-area-inset-top,20px) 26px 8px;
    min-height:0;
  }
  #calc-expr{
    color:var(--text-dim);
    font-family:var(--font-display);
    font-size:17px;
    text-align:right;
    min-height:20px;
    margin-bottom:4px;
    letter-spacing:.5px;
    white-space:nowrap;overflow:hidden;
  }
  #calc-display{
    color:var(--text-main);
    font-family:var(--font-display);
    font-weight:500;
    font-size:min(15vw,86px);
    text-align:right;
    line-height:1;
    letter-spacing:-1px;
    word-break:break-all;
  }
  #calc-keys{
    padding: 10px 14px calc(env(safe-area-inset-bottom,10px) + 10px);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-auto-rows:1fr;
    gap:12px;
    height:58%;
  }
  .key{
    border:none;
    border-radius:999px;
    font-family:var(--font-display);
    font-size:28px;
    font-weight:500;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:filter .1s ease, transform .1s ease;
  }
  .key:active{transform:scale(.94);filter:brightness(1.25);}
  .key.digit{background:var(--key-digit);color:var(--text-main);}
  .key.fn{background:var(--key-fn);color:var(--key-fn-text);}
  .key.op{background:var(--key-op);color:var(--key-op-text);font-size:32px;}
  .key.op.active-op{background:var(--text-main);color:var(--key-op);}
  .key.zero{grid-column:span 2;justify-content:flex-start;padding-left:32px;}

  #paynow-btn{
    margin:0 14px calc(env(safe-area-inset-bottom,10px) + 14px);
    border:none;border-radius:22px;
    background:linear-gradient(135deg,var(--paynow-red),#c8362c);
    color:var(--key-op-text);
    height:56px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:var(--font-body);font-size:17px;font-weight:600;letter-spacing:.3px;
    cursor:pointer;
    box-shadow:0 6px 18px -6px rgba(230,72,59,.55);
  }
  #paynow-btn:active{transform:scale(.98);}
  #paynow-btn svg{width:20px;height:20px;}

  /* ---------- PAYNOW SETUP ---------- */
  #setup-screen{background:var(--bg-2);}
  .setup-header{
    padding: calc(env(safe-area-inset-top,20px) + 6px) 22px 6px;
    display:flex;align-items:center;gap:14px;
  }
  .back-arrow{
    width:34px;height:34px;border-radius:50%;background:var(--key-digit);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  }
  .back-arrow svg{width:16px;height:16px;}
  .setup-title{color:var(--text-main);font-size:20px;font-weight:700;letter-spacing:.2px;}
  .setup-sub{color:var(--text-dim);font-size:12px;margin-top:2px;}

  .setup-body{flex:1;overflow-y:auto;padding:18px 22px 10px;}
  .amount-card{
    background:var(--bg);border:1px solid #1D2028;border-radius:20px;
    padding:18px 20px;margin-bottom:18px;text-align:center;
  }
  .amount-label{color:var(--text-dim);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;}
  .amount-value{color:var(--text-main);font-family:var(--font-display);font-size:38px;margin-top:6px;}
  .amount-value span{color:var(--accent-teal);font-size:22px;margin-right:4px;}

  .field-group{margin-bottom:16px;}
  .field-label{color:var(--text-dim);font-size:12px;margin-bottom:8px;letter-spacing:.3px;}
  .toggle-row{display:flex;background:var(--bg);border:1px solid #1D2028;border-radius:14px;padding:4px;gap:4px;}
  .toggle-opt{flex:1;text-align:center;padding:10px 0;border-radius:11px;color:var(--text-dim);font-size:14px;font-weight:600;cursor:pointer;}
  .toggle-opt.selected{background:var(--paynow-red-dim);color:var(--paynow-red);}
  input.text-input{
    width:100%;background:var(--bg);border:1px solid #1D2028;border-radius:14px;
    color:var(--text-main);font-family:var(--font-display);font-size:18px;
    padding:14px 16px;outline:none;
  }
  input.text-input:focus{border-color:var(--paynow-red);}
  input.text-input::placeholder{color:#3A3D46;}
  .hint{color:var(--text-dim);font-size:11px;margin-top:6px;line-height:1.5;}

  .amount-edit-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid #1D2028;border-radius:14px;padding:12px 16px;}
  .switch{width:46px;height:28px;border-radius:20px;background:#2A2D35;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;}
  .switch.on{background:var(--paynow-red);}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;}
  .switch.on::after{transform:translateX(18px);}

  #generate-btn{
    margin:6px 22px calc(env(safe-area-inset-bottom,10px) + 18px);
    border:none;border-radius:22px;background:var(--paynow-red);color:#fff;
    height:56px;font-size:17px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 18px -6px rgba(230,72,59,.55);
  }
  #generate-btn:disabled{background:#2A2D35;color:var(--text-dim);box-shadow:none;}
  #generate-btn:active:not(:disabled){transform:scale(.98);}

  /* ---------- QR SCREEN ---------- */
  #qr-screen{background:#F5F6F8;}
  .qr-top{
    padding:calc(env(safe-area-inset-top,20px) + 10px) 24px 4px;
    text-align:center;
  }
  .qr-brand{color:var(--paynow-red);font-weight:800;font-size:15px;letter-spacing:1px;}
  .qr-amount{color:#0A0C10;font-family:var(--font-display);font-size:34px;margin-top:6px;}
  .qr-to{color:#8A8D95;font-size:13px;margin-top:4px;}
  #qr-canvas-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;
  }
  #qrcode{
    background:#fff;padding:18px;border-radius:24px;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.25);
  }
  .qr-note{color:#8A8D95;font-size:12px;margin-top:16px;text-align:center;padding:0 40px;line-height:1.6;}
  #done-btn{
    margin:10px 22px calc(env(safe-area-inset-bottom,10px) + 18px);
    border:none;border-radius:22px;background:#0A0C10;color:#fff;
    height:56px;font-size:17px;font-weight:700;cursor:pointer;
  }
  #done-btn:active{transform:scale(.98);}
</style>
</head>
<body>
<div id="app">

  <!-- ===================== SCREEN 1 : CALCULATOR ===================== -->
  <div class="screen" id="calc-screen">
    <div id="calc-display-wrap">
      <div id="calc-expr">&nbsp;</div>
      <div id="calc-display">0</div>
    </div>
    <div id="calc-keys">
      <button class="key fn" data-action="clear">C</button>
      <button class="key fn" data-action="negate">+/-</button>
      <button class="key fn" data-action="percent">%</button>
      <button class="key op" data-op="÷">÷</button>

      <button class="key digit" data-num="7">7</button>
      <button class="key digit" data-num="8">8</button>
      <button class="key digit" data-num="9">9</button>
      <button class="key op" data-op="×">×</button>

      <button class="key digit" data-num="4">4</button>
      <button class="key digit" data-num="5">5</button>
      <button class="key digit" data-num="6">6</button>
      <button class="key op" data-op="-">-</button>

      <button class="key digit" data-num="1">1</button>
      <button class="key digit" data-num="2">2</button>
      <button class="key digit" data-num="3">3</button>
      <button class="key op" data-op="+">+</button>

      <button class="key digit zero" data-num="0">0</button>
      <button class="key digit" data-num=".">.</button>
      <button class="key op" data-action="equals">=</button>
    </div>
    <div id="paynow-btn">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z" fill="currentColor"/></svg>
      <span>用這個結果生成 PayNow 收款碼</span>
    </div>
  </div>

  <!-- ===================== SCREEN 2 : PAYNOW SETUP ===================== -->
  <div class="screen hidden-right" id="setup-screen">
    <div class="setup-header">
      <div class="back-arrow" id="back-to-calc">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#F5F6F8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="setup-title">PayNow 收款設定</div>
        <div class="setup-sub">用官方 SGQR / EMVCo 格式產生，任何銀行 App 都可掃描</div>
      </div>
    </div>
    <div class="setup-body">
      <div class="amount-card">
        <div class="amount-label">收款金額</div>
        <div class="amount-value"><span>SGD</span><span id="setup-amount">0.00</span></div>
      </div>

      <div class="field-group">
        <div class="field-label">收款方式</div>
        <div class="toggle-row">
          <div class="toggle-opt selected" data-proxy="0">手機號碼</div>
          <div class="toggle-opt" data-proxy="2">UEN (公司)</div>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label" id="proxy-label">新加坡手機號碼</div>
        <input class="text-input" id="proxy-input" placeholder="例如 91234567" inputmode="numeric">
        <div class="hint" id="proxy-hint">會自動補上 +65。銀行帳戶需已在你的銀行 App 開通 PayNow。</div>
      </div>

      <div class="field-group">
        <div class="field-label">收款人 / 商戶名稱（顯示於付款 App）</div>
        <input class="text-input" id="merchant-name" placeholder="例如 Ah Seng" maxlength="25">
      </div>

      <div class="field-group">
        <div class="field-label">備註 / 參考編號（選填）</div>
        <input class="text-input" id="ref-input" placeholder="例如 桌號3 / 訂單編號" maxlength="20">
      </div>

      <div class="field-group">
        <div class="amount-edit-toggle">
          <div>
            <div style="color:var(--text-main);font-size:14px;font-weight:600;">允許對方更改金額</div>
            <div class="hint" style="margin-top:2px;">關閉＝鎖定為上面的金額</div>
          </div>
          <div class="switch" id="editable-switch"></div>
        </div>
      </div>
    </div>
    <button id="generate-btn" disabled>生成 PayNow QR Code</button>
  </div>

  <!-- ===================== SCREEN 3 : QR DISPLAY ===================== -->
  <div class="screen hidden-right" id="qr-screen">
    <div class="qr-top">
      <div class="qr-brand">PAYNOW</div>
      <div class="qr-amount" id="qr-amount-display">SGD 0.00</div>
      <div class="qr-to" id="qr-to-display">付款給 —</div>
    </div>
    <div id="qr-canvas-wrap">
      <div id="qrcode"></div>
      <div class="qr-note">用任何新加坡銀行 App 的「掃描」或 PayNow 功能掃描此碼<br>此為標準 SGQR／EMVCo 付款碼</div>
    </div>
    <button id="done-btn">完成，返回計算機</button>
  </div>

</div>

<script>
/* ============================= 計算機邏輯 ============================= */
const display = document.getElementById('calc-display');
const exprEl = document.getElementById('calc-expr');
let current = '0';
let previous = null;
let operator = null;
let justEvaluated = false;

function fmt(numStr){
  if(numStr === 'Error') return numStr;
  let neg = numStr.startsWith('-');
  if(neg) numStr = numStr.slice(1);
  let [intPart, decPart] = numStr.split('.');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'') + intPart + (decPart !== undefined ? '.'+decPart : '');
}

function updateDisplay(){
  display.textContent = fmt(current);
  exprEl.textContent = previous !== null ? `${fmt(previous)} ${operator||''}` : '\u00A0';
  document.querySelectorAll('.key.op').forEach(k=>k.classList.remove('active-op'));
  if(operator){
    const btn = document.querySelector(`.key.op[data-op="${operator}"]`);
    if(btn) btn.classList.add('active-op');
  }
}

function inputDigit(d){
  if(justEvaluated){ current = '0'; previous=null; operator=null; justEvaluated=false; }
  if(d === '.'){
    if(current.includes('.')) return;
    current = current + '.';
  } else {
    current = (current === '0') ? d : current + d;
  }
  updateDisplay();
}

function compute(a,b,op){
  a = parseFloat(a); b = parseFloat(b);
  switch(op){
    case '+': return a+b;
    case '-': return a-b;
    case '×': return a*b;
    case '÷': return b===0 ? NaN : a/b;
  }
}

function chooseOperator(op){
  if(operator && previous!==null && !justEvaluated){
    const result = compute(previous, current, operator);
    previous = isNaN(result) ? 'Error' : String(round(result));
    current = previous;
  } else {
    previous = current;
  }
  operator = op;
  justEvaluated = false;
  current = '0';
  updateDisplay();
}

function round(n){
  return Math.round((n + Number.EPSILON) * 1e10) / 1e10;
}

function equals(){
  if(operator===null || previous===null) return;
  const result = compute(previous, current, operator);
  current = isNaN(result) ? 'Error' : String(round(result));
  previous = null; operator = null;
  justEvaluated = true;
  updateDisplay();
}

document.querySelectorAll('.key[data-num]').forEach(btn=>{
  btn.addEventListener('click', ()=> inputDigit(btn.dataset.num));
});
document.querySelectorAll('.key[data-op]').forEach(btn=>{
  btn.addEventListener('click', ()=> chooseOperator(btn.dataset.op));
});
document.querySelector('[data-action="equals"]').addEventListener('click', equals);
document.querySelector('[data-action="clear"]').addEventListener('click', ()=>{
  current='0'; previous=null; operator=null; justEvaluated=false; updateDisplay();
});
document.querySelector('[data-action="negate"]').addEventListener('click', ()=>{
  if(current==='0'||current==='Error') return;
  current = current.startsWith('-') ? current.slice(1) : '-'+current;
  updateDisplay();
});
document.querySelector('[data-action="percent"]').addEventListener('click', ()=>{
  if(current==='Error') return;
  current = String(round(parseFloat(current)/100));
  updateDisplay();
});
updateDisplay();

/* ============================= 畫面切換 ============================= */
const calcScreen = document.getElementById('calc-screen');
const setupScreen = document.getElementById('setup-screen');
const qrScreen = document.getElementById('qr-screen');

document.getElementById('paynow-btn').addEventListener('click', ()=>{
  const amt = (current==='Error') ? '0' : Math.abs(parseFloat(current)||0).toFixed(2);
  document.getElementById('setup-amount').textContent = amt;
  setupScreen.classList.remove('hidden-right');
  validateForm();
});
document.getElementById('back-to-calc').addEventListener('click', ()=>{
  setupScreen.classList.add('hidden-right');
});
document.getElementById('done-btn').addEventListener('click', ()=>{
  qrScreen.classList.add('hidden-right');
  setupScreen.classList.add('hidden-right');
});

/* ---- proxy type toggle ---- */
let proxyType = '0'; // 0 = mobile, 2 = UEN
document.querySelectorAll('.toggle-opt').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    document.querySelectorAll('.toggle-opt').forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected');
    proxyType = opt.dataset.proxy;
    const label = document.getElementById('proxy-label');
    const input = document.getElementById('proxy-input');
    const hint = document.getElementById('proxy-hint');
    if(proxyType==='0'){
      label.textContent = '新加坡手機號碼';
      input.placeholder = '例如 91234567';
      hint.textContent = '會自動補上 +65。號碼需已在你的銀行 App 開通 PayNow。';
    } else {
      label.textContent = 'UEN（公司統一編號）';
      input.placeholder = '例如 201912345A';
      hint.textContent = '公司 / 商戶的 UEN，需已在銀行開通 PayNow Corporate。';
    }
    validateForm();
  });
});

let amountEditable = false;
const sw = document.getElementById('editable-switch');
sw.addEventListener('click', ()=>{
  amountEditable = !amountEditable;
  sw.classList.toggle('on', amountEditable);
});

document.getElementById('proxy-input').addEventListener('input', validateForm);
document.getElementById('merchant-name').addEventListener('input', validateForm);

function validateForm(){
  const proxyVal = document.getElementById('proxy-input').value.trim();
  const nameVal = document.getElementById('merchant-name').value.trim();
  document.getElementById('generate-btn').disabled = !(proxyVal.length>0 && nameVal.length>0);
}

/* ============================= EMVCo / SGQR PayNow 編碼 ============================= */
// 官方 PayNow QR 規格（由新加坡銀行公會 ABS 發布的 SGQR / EMVCo 標準）
// 以下依規格逐一組 TLV 欄位，並非自創格式 —— 任何本地銀行 App 皆可掃描付款。

function tlv(id, value){
  const len = String(value.length).padStart(2,'0');
  return id + len + value;
}

function crc16(payload){
  // CRC-16/CCITT-FALSE, poly 0x1021, init 0xFFFF — EMVCo 規定的演算法
  let crc = 0xFFFF;
  for(let i=0;i<payload.length;i++){
    crc ^= (payload.charCodeAt(i) << 8);
    for(let b=0;b<8;b++){
      if((crc & 0x8000) !== 0){
        crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
      } else {
        crc = (crc << 1) & 0xFFFF;
      }
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}

function buildPayNowPayload({proxyType, proxyValue, amount, editable, merchantName, reference}){
  const merchantAccount =
      tlv('00','SG.PAYNOW') +
      tlv('01', proxyType) +
      tlv('02', proxyValue) +
      tlv('03', editable ? '1':'0');

  let payload =
      tlv('00','01') +                         // Payload Format Indicator
      tlv('01', amount>0 ? '12':'11') +        // 12 = dynamic(有金額) / 11 = static
      tlv('26', merchantAccount) +             // PayNow merchant account info
      tlv('52','0000') +                       // Merchant Category Code
      tlv('53','702') +                        // Currency = SGD
      (amount>0 ? tlv('54', amount.toFixed(2)) : '') +
      tlv('58','SG') +
      tlv('59', merchantName.slice(0,25)) +
      tlv('60','Singapore');

  if(reference){
    payload += tlv('62', tlv('01', reference.slice(0,20)));
  }

  payload += '6304'; // CRC id + length placeholder
  const crc = crc16(payload);
  return payload + crc;
}

document.getElementById('generate-btn').addEventListener('click', ()=>{
  const rawProxy = document.getElementById('proxy-input').value.trim();
  const merchantName = document.getElementById('merchant-name').value.trim() || 'Merchant';
  const reference = document.getElementById('ref-input').value.trim();
  const amount = parseFloat(document.getElementById('setup-amount').textContent) || 0;

  let proxyValue = rawProxy;
  if(proxyType==='0'){
    proxyValue = rawProxy.replace(/\D/g,'');
    if(!proxyValue.startsWith('65')) proxyValue = '65'+proxyValue;
    proxyValue = '+'+proxyValue;
  }

  const payload = buildPayNowPayload({
    proxyType, proxyValue, amount,
    editable: amountEditable,
    merchantName, reference
  });

  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'), {
    text: payload,
    width: 240,
    height: 240,
    correctLevel: QRCode.CorrectLevel.M
  });

  document.getElementById('qr-amount-display').textContent =
      'SGD ' + amount.toFixed(2) + (amountEditable ? ' (可更改)' : '');
  document.getElementById('qr-to-display').textContent =
      '付款給 ' + merchantName + (reference ? ' · '+reference : '');

  setupScreen.classList.add('hidden-right');
  qrScreen.classList.remove('hidden-right');
});
</script>
</body>
</html>
